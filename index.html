<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jq-wasm</title>
<style>
:root {
    color-scheme: light dark;
    --bg: #f8f9fb;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #c2410c;
    --error: #b91c1c;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

/* Dark palette when the system asks for it. */
@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0b1120;
        --surface: #111827;
        --border: #1f2937;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #fdba74;
        --error: #f87171;
    }
}

*, *::before, *::after { box-sizing: border-box; }

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 var(--mono);
}

/* Header, query and examples on top; the two panes fill the rest of the window. */
.app {
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 1200px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    padding: 24px 16px;
}

header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 16px;
}
h1 { margin: 0; font-size: 14px; }
header p { margin: 0; color: var(--muted); }
header nav { display: flex; gap: 16px; margin-left: auto; }

a, .examples button {
    color: var(--text);
    text-decoration: underline;
    text-decoration-color: var(--border);
    text-underline-offset: 3px;
}
a:hover, .examples button:hover, .examples button[aria-current="true"] {
    color: var(--accent);
    text-decoration-color: currentColor;
}

label, .label {
    display: block;
    margin-bottom: 4px;
    color: var(--muted);
    font-size: 13px;
}

input, textarea {
    width: 100%;
    margin: 0;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 2px;
    background: var(--surface);
    color: inherit;
    font: inherit;
}
textarea { resize: none; }
::placeholder { color: var(--muted); }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }

.examples {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    font-size: 13px;
}
.examples .label { display: inline; margin: 0 8px 0 0; }
.examples ul { display: contents; }
.examples li { list-style: none; }
/* Separator after each link, so a wrapped line never starts with one. */
.examples li:not(:last-child)::after { content: "·"; margin: 0 8px; color: var(--muted); }
.examples button {
    padding: 0;
    border: 0;
    background: none;
    font: inherit;
    cursor: pointer;
}

.panes {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}
.pane { display: flex; flex-direction: column; min-height: 0; }
.pane textarea { flex: 1; min-height: 160px; }
.pane-footer {
    min-height: 1.5em;
    margin: 4px 0 0;
    color: var(--error);
    font-size: 13px;
    overflow-wrap: anywhere;
}
#output.is-error { color: var(--error); }

.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
}

/* Narrow screens: stack everything and let the page scroll. */
@media (max-width: 720px) {
    .app { height: auto; padding-top: 16px; }
    header nav { margin-left: 0; }
    .panes { grid-template-columns: 1fr; }
    .pane textarea { flex: none; height: 40vh; }
    /* 16px stops iOS from zooming into the field on focus. */
    input, textarea { font-size: 16px; }
}
</style>
</head>
<body>
<div class="app">
    <header>
        <h1>jq-wasm</h1>
        <p>jq 1.8.2 compiled to WebAssembly, running in your browser.</p>
        <nav>
            <a href="https://github.com/pboutes/jq-wasm">github</a>
            <a href="https://jqlang.org/manual/">jq manual</a>
        </nav>
    </header>

    <div>
        <label for="query">query</label>
        <input id="query" type="text" placeholder=".[] | .name" spellcheck="false" autocomplete="off" autocapitalize="off">
    </div>

    <nav class="examples" aria-label="examples">
        <span class="label">examples:</span>
        <ul id="examples"></ul>
    </nav>

    <main class="panes">
        <div class="pane">
            <label for="input">input</label>
            <textarea id="input" placeholder="paste json here" spellcheck="false"></textarea>
            <p id="input-error" class="pane-footer" aria-live="polite"></p>
        </div>
        <div class="pane">
            <label for="output">output</label>
            <textarea id="output" readonly spellcheck="false"></textarea>
            <p class="pane-footer" aria-hidden="true"></p>
        </div>
    </main>

    <!-- Announces jq errors to screen readers; results are not announced. -->
    <p id="output-status" class="sr-only" aria-live="polite"></p>
</div>

<script>
if (!window.Worker) {
    console.warn('jq-wasm needs Web Worker support.');
} else {
    const EXAMPLES = [
        {name: 'basic', json: [{name: 'JSON', good: true}, {name: 'XML', good: false}], query: '.[0].name'},
        {name: 'pipe', json: [{name: 'JSON', good: true}, {name: 'XML', good: false}], query: '.[] | .name'},
        {
            name: 'destructuring',
            json: [{a: 1, b: 2, c: {d: 3, e: 4}}, {a: 1, b: 2, c: [{d: 3, e: 4}]}],
            query: '.[] as {$a, $b, c: {$d, $e}} ?// {$a, $b, c: [{$d, $e}]} | {$a, $b, $d, $e}',
        },
        {name: 'maths', json: 1, query: '(. + 2) * 5'},
        {name: 'recursive descent', json: [[{a: 1}]], query: '..|.a?'},
        {name: 'regexp capture', json: 'xyzzy-14', query: 'capture("(?<a>[a-z]+)-(?<n>[0-9]+)")'},
        {
            name: 'variables',
            json: {
                posts: [{title: 'Frist psot', author: 'anon'}, {title: 'A well-written article', author: 'person1'}],
                realnames: {anon: 'Anonymous Coward', person1: 'Person McPherson'},
            },
            query: '.realnames as $names | .posts[] | {title, author: $names[.author]}',
        },
        {name: 'functions', json: [[1, 2], [10, 20]], query: 'def addvalue(f): . + [f]; map(addvalue(.[0]))'},
        {name: 'has(key)', json: [{foo: 42}, {}], query: 'map(has("foo"))'},
        {name: 'arithmetic assignment', json: {foo: 42}, query: '[.foo += 1, .foo *= 2, .foo -=1, .foo /= 2]'},
    ];

    const queryElm = document.querySelector('#query');
    const inputElm = document.querySelector('#input');
    const outputElm = document.querySelector('#output');
    const inputErrorElm = document.querySelector('#input-error');
    const outputStatusElm = document.querySelector('#output-status');
    const examplesElm = document.querySelector('#examples');

    const worker = new Worker('./dist/worker.js', {type: 'module'});

    // Run the query once typing pauses, not on every keystroke.
    const DEBOUNCE_MS = 150;
    let pendingSend;

    // False while the JSON input is blank or invalid: replies still in flight
    // for an earlier input must not overwrite the cleared output.
    let inputOk = false;

    // Show invisible characters (zero-width space, BOM, no-break space...)
    // in error messages as their code point, e.g. U+200B.
    const showInvisible = (text) => text.replace(/(?! )[\p{Cf}\p{Z}]/gu,
        ch => 'U+' + ch.codePointAt(0).toString(16).toUpperCase().padStart(4, '0'));

    const showOutput = (text, isError) => {
        outputElm.value = text;
        outputElm.classList.toggle('is-error', isError);
        outputStatusElm.textContent = isError ? text : '';
    };

    // Send json and query to the worker.
    const send = () => {
        clearTimeout(pendingSend);
        const text = inputElm.value;
        let json;
        try {
            json = JSON.parse(text);
        } catch (e) {
            // Blank input is not an error, there is just nothing to process yet.
            inputErrorElm.textContent = text.trim() ? `invalid json: ${showInvisible(e.message)}` : '';
            inputOk = false;
            showOutput('', false);
            return;
        }
        inputErrorElm.textContent = '';
        inputOk = true;
        worker.postMessage({json, query: queryElm.value});
    };

    // Show the result pretty-printed, or jq's own error message.
    worker.onmessage = (e) => {
        if (!inputOk) return;
        const {ok, result, error} = e.data;
        showOutput(ok ? JSON.stringify(result, null, 2) : error.trim(), !ok);
    };

    // An example link stays marked until the query or input is edited.
    const exampleButtons = EXAMPLES.map((example) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = example.name;
        button.addEventListener('click', () => loadExample(example, button));
        const item = document.createElement('li');
        item.append(button);
        examplesElm.append(item);
        return button;
    });

    const markExample = (current) => {
        for (const button of exampleButtons) {
            if (button === current) button.setAttribute('aria-current', 'true');
            else button.removeAttribute('aria-current');
        }
    };

    const loadExample = (example, button) => {
        queryElm.value = example.query;
        inputElm.value = JSON.stringify(example.json, null, 2);
        markExample(button);
        send();
    };

    for (const field of [queryElm, inputElm]) {
        field.addEventListener('input', () => {
            markExample(null);
            clearTimeout(pendingSend);
            pendingSend = setTimeout(send, DEBOUNCE_MS);
        });
    }

    // Open on the first example rather than empty boxes.
    loadExample(EXAMPLES[0], exampleButtons[0]);
}
</script>
</body>
</html>
